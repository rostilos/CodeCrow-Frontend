server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Vite content-hashes every generated bundle and imported asset. Only this
    # namespace is safe for immutable caching.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA entry document selects the current content-hashed bundles and
    # therefore must be fetched for every navigation/reload.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Expires "0" always;
    }

    # Files copied from public/ keep stable URLs. Revalidate them so a release
    # can replace a logo, manifest, or other public file without a stale client.
    location ~* \.(?:css|js|mjs|map|json|webmanifest|xml|txt|png|jpe?g|gif|webp|avif|ico|svg|woff2?|ttf|eot|mp4|webm|pdf)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # SPA fallback. The internal redirect reaches the non-cacheable exact
    # /index.html location above.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
